services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: [.env]
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on: [app, redis]
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: [.env]
    command: ["php", "artisan", "horizon"]
    depends_on: [app, redis]
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: [.env]
    command: ["php", "artisan", "schedule:work"]
    depends_on: [app, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-curupira}
      POSTGRES_USER: ${DB_USERNAME:-curupira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-curupira} -d ${DB_DATABASE:-curupira}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 10 }
volumes:
  postgres-data:
  redis-data:
